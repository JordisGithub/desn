name: Deploy to AWS

on:
  workflow_dispatch: # Manual trigger option
  push:
    branches:
      - master

jobs:
  pre-deployment-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Build application
        run: npm run build
        env:
          VITE_API_BASE_URL: "http://15.206.210.71"

      - name: Serve application for testing
        run: |
          npm install -g serve a11y-mcp
          serve -s dist -l 3000 &
          sleep 5

      - name: Pre-deployment accessibility audit
        id: pre-deploy-audit
        run: |
          mkdir -p pre-deploy-audit

          # Audit critical pages with a11y-mcp
          echo "Running pre-deployment accessibility audit..."
          npx a11y-mcp audit http://localhost:3000 --tags wcag2a,wcag2aa,wcag22aa > pre-deploy-audit/home.json
          npx a11y-mcp audit http://localhost:3000/about --tags wcag2a,wcag2aa,wcag22aa > pre-deploy-audit/about.json
          npx a11y-mcp audit http://localhost:3000/events --tags wcag2a,wcag2aa,wcag22aa > pre-deploy-audit/events.json

          # Count critical violations
          critical_count=0
          for file in pre-deploy-audit/*.json; do
            if [ -f "$file" ]; then
              critical=$(grep -c '"impact":"critical"' "$file" || echo "0")
              critical_count=$((critical_count + critical))
            fi
          done

          echo "critical_count=$critical_count" >> $GITHUB_OUTPUT

          if [ "$critical_count" -gt "0" ]; then
            echo "❌ Found $critical_count critical accessibility issues!"
            echo "Deployment blocked. Please fix critical issues before deploying."
            exit 1
          fi

          echo "✅ No critical accessibility issues found. Deployment approved."

      - name: Upload pre-deployment audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-deployment-audit
          path: pre-deploy-audit/
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: pre-deployment-validation
    # Required secrets: SSH_PRIVATE_KEY, SERVER_HOST, SERVER_USER
    # Configure these in Repository Settings > Secrets and variables > Actions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          # Point frontend API calls to production endpoint
          VITE_API_BASE_URL: "http://15.206.210.71"
        run: npm run build

      - name: Build backend
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Deploy to AWS Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e

          # Setup SSH
          echo "📡 Setting up SSH connection..."

          # Verify secrets are set
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "$SERVER_HOST" ]; then
            echo "❌ SERVER_HOST secret is not set"
            exit 1
          fi
          if [ -z "$SERVER_USER" ]; then
            echo "❌ SERVER_USER secret is not set"
            exit 1
          fi

          echo "Creating SSH directory..."
          mkdir -p ~/.ssh

          echo "Writing SSH key..."
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key || {
            echo "❌ Failed to write SSH key"
            exit 1
          }

          echo "Setting SSH key permissions..."
          chmod 600 ~/.ssh/deploy_key

          echo "Configuring SSH client..."
          cat >> ~/.ssh/config <<SSH_CONFIG
          Host $SERVER_HOST
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          SSH_CONFIG

          echo "Testing SSH connection..."
          ssh -o ConnectTimeout=10 $SERVER_USER@$SERVER_HOST "echo 'SSH connection successful'" || {
            echo "❌ Failed to connect to server"
            echo "Please verify:"
            echo "  - SSH_PRIVATE_KEY is correct and properly formatted"
            echo "  - SERVER_USER has access to the server"
            echo "  - SERVER_HOST is reachable"
            echo "  - The SSH key is authorized on the server"
            exit 1
          }

          echo "✅ SSH setup complete"

          # Create deployment directory on server
          echo "📁 Creating deployment directories on server..."
          ssh $SERVER_USER@$SERVER_HOST "mkdir -p /home/$SERVER_USER/desn-app/{frontend,backend,logs,data}" || {
            echo "❌ Failed to create directories on server"
            exit 1
          }
          echo "✅ Directories created"

          # Copy frontend build
          echo "📤 Copying frontend build..."
          if [ ! -d "dist" ]; then
            echo "❌ dist directory not found!"
            exit 1
          fi
          scp -r dist/* $SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/desn-app/frontend/ || {
            echo "❌ Failed to copy frontend files"
            exit 1
          }
          echo "✅ Frontend copied"

          # Copy backend JAR (detect non-original jar)
          echo "📤 Copying backend JAR..."
          JAR_FILE=$(ls backend/target/*.jar | grep -v "original" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ No backend jar found in backend/target"
            ls -la backend/target/ || echo "backend/target directory not found"
            exit 1
          fi
          echo "Found JAR: $JAR_FILE"
          scp "$JAR_FILE" $SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/desn-app/backend/app.jar || {
            echo "❌ Failed to copy backend JAR"
            exit 1
          }
          echo "✅ Backend JAR copied"

          # Create environment file on server with production settings
          echo "⚙️ Creating environment file..."
          ssh $SERVER_USER@$SERVER_HOST "cat > /home/$SERVER_USER/desn-app/backend/.env" <<'ENVFILE'
          DATABASE_URL=jdbc:postgresql://localhost:5432/desn
          DATABASE_USERNAME=desn_user
          DATABASE_PASSWORD=desn_password_2025
          EMAIL_NOTIFICATIONS_ENABLED=false
          ENVFILE
          echo "✅ Environment file created"

          # Deploy frontend to nginx
          echo "🌐 Deploying frontend..."
          ssh $SERVER_USER@$SERVER_HOST "sudo cp -r /home/$SERVER_USER/desn-app/frontend/* /var/www/html/" || {
            echo "❌ Failed to deploy frontend"
            exit 1
          }
          echo "✅ Frontend deployed"

          # Restart backend service
          echo "🚀 Restarting backend service..."
          ssh $SERVER_USER@$SERVER_HOST "sudo systemctl restart desn-backend" || {
            echo "❌ Failed to restart backend"
            echo "📋 Checking backend logs..."
            ssh $SERVER_USER@$SERVER_HOST "sudo journalctl -u desn-backend -n 50 --no-pager"
            exit 1
          }

          # Reload nginx
          echo "🌐 Reloading nginx..."
          ssh $SERVER_USER@$SERVER_HOST "sudo systemctl reload nginx" || {
            echo "❌ Failed to reload nginx"
            exit 1
          }

          echo "✅ Deployment completed successfully"

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # Wait for services to start
          sleep 10

          # Check if backend is running
          ssh $SERVER_USER@$SERVER_HOST "curl -f http://localhost:8080/actuator/health || exit 1"

          echo "✅ Deployment successful!"
          echo "🌐 Frontend: http://$SERVER_HOST"
          echo "🔧 Backend: http://$SERVER_HOST/api"
