name: Deploy to AWS

on:
  workflow_dispatch: # Manual trigger option
  push:
    branches:
      - master

jobs:
  pre-deployment-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Build application
        run: npm run build
        env:
          VITE_API_BASE_URL: "http://15.206.210.71"

      - name: Serve application for testing
        run: |
          npm install -g serve a11y-mcp
          serve -s dist -l 3000 &
          sleep 5

      - name: Pre-deployment accessibility audit
        id: pre-deploy-audit
        run: |
          mkdir -p pre-deploy-audit

          # Audit critical pages with a11y-mcp
          echo "Running pre-deployment accessibility audit..."
          npx a11y-mcp audit http://localhost:3000 --tags wcag2a,wcag2aa,wcag22aa > pre-deploy-audit/home.json
          npx a11y-mcp audit http://localhost:3000/about --tags wcag2a,wcag2aa,wcag22aa > pre-deploy-audit/about.json
          npx a11y-mcp audit http://localhost:3000/events --tags wcag2a,wcag2aa,wcag22aa > pre-deploy-audit/events.json

          # Count critical violations
          critical_count=0
          for file in pre-deploy-audit/*.json; do
            if [ -f "$file" ]; then
              critical=$(grep -c '"impact":"critical"' "$file" || echo "0")
              critical_count=$((critical_count + critical))
            fi
          done

          echo "critical_count=$critical_count" >> $GITHUB_OUTPUT

          if [ "$critical_count" -gt "0" ]; then
            echo "❌ Found $critical_count critical accessibility issues!"
            echo "Deployment blocked. Please fix critical issues before deploying."
            exit 1
          fi

          echo "✅ No critical accessibility issues found. Deployment approved."

      - name: Upload pre-deployment audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-deployment-audit
          path: pre-deploy-audit/
          retention-days: 30

  build-artifacts:
    runs-on: ubuntu-latest
    needs: pre-deployment-validation
    # Builds and uploads deployment artifacts - no SSH required
    # Server can pull these artifacts using a deployment script

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          # Point frontend API calls to production endpoint
          VITE_API_BASE_URL: "http://15.206.210.71"
        run: npm run build

      - name: Build backend
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Package deployment artifacts
        run: |
          set -e

          echo "📦 Creating deployment package..."
          mkdir -p deployment-package

          # Copy frontend build
          echo "Packaging frontend..."
          cp -r dist deployment-package/frontend

          # Copy backend JAR
          echo "Packaging backend..."
          mkdir -p deployment-package/backend
          JAR_FILE=$(ls backend/target/*.jar | grep -v "original" | head -n 1)
          cp "$JAR_FILE" deployment-package/backend/app.jar

          # Create deployment metadata
          cat > deployment-package/metadata.json <<METADATA
          {
            "build_number": "${{ github.run_number }}",
            "commit_sha": "${{ github.sha }}",
            "commit_message": "${{ github.event.head_commit.message }}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "frontend_files": $(find deployment-package/frontend -type f | wc -l),
            "backend_jar": "app.jar"
          }
          METADATA

          # Create deployment instructions
          cat > deployment-package/DEPLOY.md <<'DEPLOY'
          # Deployment Instructions

          ## Automated Deployment (Recommended)

          1. Download the latest `deployment-package.tar.gz` from GitHub Actions artifacts
          2. Extract on your server: `tar -xzf deployment-package.tar.gz`
          3. Run the deployment script: `sudo ./deploy.sh`

          ## Manual Deployment

          ### Frontend:
          ```bash
          sudo cp -r frontend/* /var/www/html/
          ```

          ### Backend:
          ```bash
          cp backend/app.jar /home/$USER/desn-app/backend/
          sudo systemctl restart desn-backend
          ```

          ### Nginx:
          ```bash
          sudo systemctl reload nginx
          ```
          DEPLOY

          # Create deployment script
          cat > deployment-package/deploy.sh <<'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e

          echo "🚀 Starting DESN deployment..."

          # Check if running as root or with sudo
          if [ "$EUID" -ne 0 ]; then
            echo "❌ Please run with sudo: sudo ./deploy.sh"
            exit 1
          fi

          # Deploy frontend
          echo "📤 Deploying frontend..."
          cp -r frontend/* /var/www/html/
          echo "✅ Frontend deployed"

          # Deploy backend
          echo "📤 Deploying backend..."
          mkdir -p /home/$SUDO_USER/desn-app/backend
          cp backend/app.jar /home/$SUDO_USER/desn-app/backend/
          chown $SUDO_USER:$SUDO_USER /home/$SUDO_USER/desn-app/backend/app.jar
          echo "✅ Backend deployed"

          # Restart services
          echo "🔄 Restarting services..."
          systemctl restart desn-backend
          systemctl reload nginx
          echo "✅ Services restarted"

          # Verify deployment
          sleep 3
          if systemctl is-active --quiet desn-backend; then
            echo "✅ Backend service is running"
          else
            echo "❌ Backend service failed to start"
            echo "📋 Check logs: sudo journalctl -u desn-backend -n 50"
            exit 1
          fi

          if systemctl is-active --quiet nginx; then
            echo "✅ Nginx is running"
          else
            echo "❌ Nginx failed to start"
            exit 1
          fi

          echo ""
          echo "🎉 Deployment completed successfully!"
          echo "🌐 Frontend: http://15.206.210.71"
          echo "🔧 Backend: http://15.206.210.71/api"
          DEPLOY_SCRIPT

          chmod +x deployment-package/deploy.sh

          # Create tarball
          tar -czf deployment-package.tar.gz deployment-package/

          echo "✅ Deployment package created: deployment-package.tar.gz"
          ls -lh deployment-package.tar.gz

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-${{ github.run_number }}
          path: deployment-package.tar.gz
          retention-days: 30

      - name: Create deployment summary
        run: |
          echo "## 📦 Deployment Package Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build #${{ github.run_number }} completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download & Deploy" >> $GITHUB_STEP_SUMMARY
          echo "1. Download \`deployment-package-${{ github.run_number }}.tar.gz\` from artifacts above" >> $GITHUB_STEP_SUMMARY
          echo "2. Transfer to your server: \`scp deployment-package.tar.gz user@15.206.210.71:~\`" >> $GITHUB_STEP_SUMMARY
          echo "3. SSH to server and extract: \`tar -xzf deployment-package.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Run deployment: \`cd deployment-package && sudo ./deploy.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)" >> $GITHUB_STEP_SUMMARY
