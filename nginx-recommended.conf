################################################################################
# NGINX Configuration - DESN (Canonical Domain Only)
# Domain:
#   Canonical: desnepal.org (www also served)
#
# Place this file at /etc/nginx/sites-available/desn.conf then enable:
#   sudo ln -sf /etc/nginx/sites-available/desn.conf /etc/nginx/sites-enabled/desn.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Issue certificates (after DNS A records propagate):
#   sudo certbot --nginx -d desnepal.org -d www.desnepal.org --agree-tos -m admin@desnepal.org --redirect --no-eff-email
#
# Static build root: /var/www/desnepal
# Backend upstream: 127.0.0.1:8080 (Spring Boot)
################################################################################

# Upstream backend (must be outside server blocks)
upstream desn_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# =============================
# 1a. HTTP (.com) -> HTTPS (.org) - Legacy domain redirect
# =============================
server {
    listen 80;
    listen [::]:80;
    server_name desnepal.com www.desnepal.com;

    # ACME challenge support (if using webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/desnepal;
    }

    return 301 https://desnepal.org$request_uri;
}

# =============================
# 1b. HTTP (.org / www) -> HTTPS (.org)
# =============================
server {
    listen 80;
    listen [::]:80;
    server_name desnepal.org www.desnepal.org;

    # ACME challenge support (if using webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/desnepal;
    }

    return 301 https://desnepal.org$request_uri;
}

# =============================
# 2a. HTTPS (.com) -> HTTPS (.org) - Legacy domain redirect
# =============================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name desnepal.com www.desnepal.com;

    # SSL certs for .com (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/desnepal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desnepal.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    return 301 https://desnepal.org$request_uri;
}

# =============================
# 2b. HTTPS Canonical (.org)
# =============================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name desnepal.org www.desnepal.org;

    # SSL certs (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/desnepal.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desnepal.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Security / Hardening
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Frontend root
    root /var/www/desnepal;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # API proxy
    location /api/ {
        proxy_pass http://desn_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Resource files served through backend (PDFs etc.)
    location /resources/ {
        proxy_pass http://desn_backend/resources/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Static assets caching
    location ~* \.(?:jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

################################################################################
# End of configuration
################################################################################
