# NGINX Bootstrap Config - DESN (HTTP only, for initial cert issuance)
# Use this config FIRST to issue SSL certs, then switch to nginx-recommended.conf

upstream desn_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name desnepal.org www.desnepal.org;

    # ACME challenge support
    location /.well-known/acme-challenge/ {
        root /var/www/desnepal;
    }

    # Frontend root
    root /var/www/desnepal;
    index index.html;

    # API proxy
    location /api/ {
        proxy_pass http://desn_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
